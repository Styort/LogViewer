name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    # WPF on .NET Framework 4.8: needs Visual Studio MSBuild, `dotnet build` cannot compile the legacy WPF csproj.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2
      - uses: darenm/Setup-VSTest@v1.3

      - name: Restore
        # nuget.exe restores both packages.config (WPF host) and PackageReference (Core, tests).
        run: nuget restore src/LogViewer.sln

      - name: Build
        run: msbuild src/LogViewer.sln -p:Configuration=Release -p:TreatWarningsAsErrors=true -m -nologo -v:m

      - name: Test
        run: >
          vstest.console.exe
          src/LogViewer.Core.Tests/bin/Release/net48/LogViewer.Core.Tests.dll
          src/LogViewer.App.Tests/bin/Release/net48/LogViewer.App.Tests.dll
          /logger:trx /ResultsDirectory:TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/

      - name: Stage app
        # Same packaging as release.yml (build/stage.ps1): the whole output folder including en/,
        # without symbols and library XML docs. The artifact is named after the built version.
        shell: pwsh
        run: |
          $version = ./build/stage.ps1 -Output publish/LogViewer
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: LogViewer-${{ env.APP_VERSION }}
          path: publish/LogViewer/
