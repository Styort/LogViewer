name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    # WPF on .NET Framework 4.8: needs Visual Studio MSBuild, `dotnet build` cannot compile the legacy WPF csproj.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2
      - uses: darenm/Setup-VSTest@v1.3

      - name: Restore
        # nuget.exe restores both packages.config (WPF host) and PackageReference (Core, tests).
        run: nuget restore src/LogViewer.sln

      - name: Build
        run: msbuild src/LogViewer.sln -p:Configuration=Release -p:TreatWarningsAsErrors=true -m -nologo -v:m

      - name: Test
        run: >
          vstest.console.exe
          src/LogViewer.Core.Tests/bin/Release/net48/LogViewer.Core.Tests.dll
          src/LogViewer.App.Tests/bin/Release/net48/LogViewer.App.Tests.dll
          /logger:trx /ResultsDirectory:TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/

      - name: Stage app
        # The whole output folder, subfolders included: English UI strings are a satellite assembly
        # (en/LogViewer.resources.dll). Without it the app silently falls back to Russian.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'publish/LogViewer'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item 'src/bin/Release/*' $stage -Recurse
          # Not needed at run time: symbols, stray zips, the app's own log folder.
          Get-ChildItem $stage -Recurse -Include *.pdb, *.zip | Remove-Item -Force
          Remove-Item (Join-Path $stage 'logs') -Recurse -Force -ErrorAction SilentlyContinue
          # XML docs of referenced libraries (X.xml next to X.dll); ReleaseNotes.xml has no dll and stays.
          Get-ChildItem $stage -Recurse -Filter *.xml |
              Where-Object { Test-Path ([IO.Path]::ChangeExtension($_.FullName, '.dll')) } |
              Remove-Item -Force
          foreach ($required in 'LogViewer.exe', 'LogViewer.exe.config', 'ReleaseNotes.xml', 'en/LogViewer.resources.dll') {
              if (-not (Test-Path (Join-Path $stage $required))) { throw "Missing in the package: $required" }
          }

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: LogViewer
          path: publish/LogViewer/
